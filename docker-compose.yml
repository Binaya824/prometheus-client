version: "3"

services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss
    ports:
      - "4545:4545"  # Host:Container
    environment:
      - GF_SERVER_HTTP_PORT=4545  # Maps host port 4545 to Grafana's default container port 3000
      - GF_SERVER_ROOT_URL=http://grafana:4545/
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge